name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Inventory_ci_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Inventory_ci_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=InventoryCi;user=sa;password=Inventory_ci_2026!;encrypt=true;trustServerCertificate=true;"
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_MFA_SECRET: ci-mfa-secret
      FRONTEND_ORIGIN: http://localhost:4200

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Backend audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Backend migrate
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Backend seed
        working-directory: backend
        run: npm run db:seed

      - name: Backend test
        working-directory: backend
        env:
          NODE_ENV: test
        run: npm test

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend test
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Docker build
        run: docker build -t inventory-management-system .

  deploy:
    name: Deploy to Azure App Service
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Every step below needs Azure resources that are created per-subscription.
    # Until those secrets exist the job is skipped rather than failing the run,
    # so the pipeline stays green for anyone who clones this without an Azure
    # account. See README "Deployment" for the one-time setup.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secrets are configured
        id: guard
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          REGISTRY_LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ] || [ -z "$AZURE_WEBAPP_NAME" ] || [ -z "$REGISTRY_LOGIN_SERVER" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure deployment secrets are not set — skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login
        if: steps.guard.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Registry login
        if: steps.guard.outputs.configured == 'true'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        if: steps.guard.outputs.configured == 'true'
        env:
          IMAGE: ${{ secrets.REGISTRY_LOGIN_SERVER }}/inventory-management-system
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Setup Node for migrations
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply database migrations
        if: steps.guard.outputs.configured == 'true'
        working-directory: backend
        env:
          # Points at Azure SQL Database. Never committed — set as a repository
          # secret, or resolved from Key Vault by the App Service managed identity.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npx prisma migrate deploy

      - name: Seed demo data
        # Demo data only, never the real business data — the public demo is
        # reset on each deploy so visitors always see a known-good dataset.
        if: steps.guard.outputs.configured == 'true' && vars.SEED_DEMO_ON_DEPLOY == 'true'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:seed:demo

      - name: Deploy to App Service
        if: steps.guard.outputs.configured == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.REGISTRY_LOGIN_SERVER }}/inventory-management-system:${{ github.sha }}

      - name: Smoke test the deployment
        if: steps.guard.outputs.configured == 'true'
        env:
          APP_URL: ${{ secrets.AZURE_WEBAPP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::AZURE_WEBAPP_URL not set — skipping smoke test."
            exit 0
          fi
          for attempt in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/health" || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $attempt: health check returned $status; retrying..."
            sleep 15
          done
          echo "::error::Deployment did not become healthy."
          exit 1
